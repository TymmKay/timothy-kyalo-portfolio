<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timothy Kyalo Syombua – Construction Estimator & Project Manager</title>
<meta name="description" content="Construction estimator and project manager in Nairobi with 5+ years expertise in MEP coordination, cost management, and commercial fit-outs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDEFEF;--ink:#17212B;--steel:#2E5266;--hv:#F2C230;--line:#C5CBCF;--mute:#4A5763;
--ticks:linear-gradient(var(--line),var(--line)) 6.7% 0/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) 26.7% 0/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) 46.7% 0/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) 66.7% 0/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) 86.7% 0/1px 100% no-repeat}
*{box-sizing:border-box;margin:0}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{font-family:Archivo,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:17px}
a{color:inherit}
:focus-visible{outline:3px solid var(--steel);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
header .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:20px;padding-bottom:20px;gap:16px;flex-wrap:wrap}
header b{font-weight:800}
nav{display:flex;gap:22px;font-size:15px}
nav a{text-decoration:none;font-weight:500}
nav a:hover{text-decoration:underline;text-decoration-color:var(--hv);text-decoration-thickness:3px;text-underline-offset:5px}
.cover{display:block;width:100%;height:auto;border:2px solid var(--ink)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:56px;align-items:center;padding:48px 0 80px}
h1,h2{font-stretch:62%;font-weight:800;line-height:.95}
h1{font-size:clamp(3.2rem,10vw,6.5rem)}
h1 span{display:block}
.role{font-size:1.25rem;font-weight:600;color:var(--steel);margin-top:20px}
.lede{max-width:54ch;margin-top:16px;color:var(--mute)}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{padding:12px 20px;border:2px solid var(--ink);font-weight:700;text-decoration:none;font-size:16px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:hover{background:var(--hv);color:var(--ink)}
.photo{position:relative;aspect-ratio:1/1;width:100%;max-width:400px;justify-self:end}
.photo::before{content:"";position:absolute;inset:16px -16px -16px 16px;background:var(--hv)}
.frame{position:absolute;inset:0;background:#D3D9DC;display:grid;place-items:center;color:var(--steel);font-stretch:62%;font-weight:800;font-size:7rem;overflow:hidden}
.frame[data-ini]::after{content:attr(data-ini)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom}
section{padding:72px 0;border-top:2px solid var(--ink)}
h2{font-size:clamp(2.2rem,5vw,3.2rem);margin-bottom:12px}
.sub{color:var(--mute);max-width:60ch;margin-bottom:36px}
.axis{position:relative;height:24px;font-size:14px;color:var(--mute)}
.axis span{position:absolute;transform:translateX(-50%)}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:20px 0 14px}
summary::-webkit-details-marker{display:none}
.who{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.who::after{content:"+";font-size:1.6rem;line-height:1;font-weight:700}
details[open] .who::after{content:"−"}
.who b{display:block;font-size:1.2rem}
.who em{font-style:normal;color:var(--mute);font-size:15px}
.track{display:block;position:relative;height:28px;margin-top:12px;background:var(--ticks)}
.bar{position:absolute;top:4px;bottom:4px;background:var(--steel)}
.bar.now{background:var(--hv);outline:2px solid var(--ink)}
details ul{padding:4px 0 24px 20px;max-width:70ch}
li{margin:6px 0}
.proj{display:grid;grid-template-columns:90px 1fr 1.4fr;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}
.proj b{font-weight:700}
.proj span{color:var(--mute)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:48px}
h3{font-size:1.1rem;margin-bottom:8px}
.list{list-style:none;padding:0}
.list li{margin:0;padding:10px 0;border-bottom:1px solid var(--line)}
.list small{display:block;color:var(--mute);font-size:15px}
.mail{font-stretch:62%;font-weight:800;font-size:clamp(2rem,7vw,4.2rem);line-height:1;text-decoration:underline;text-decoration-color:var(--hv);text-decoration-thickness:8px;text-underline-offset:6px;word-break:break-word}
.contact p{margin-top:20px;font-size:1.1rem}
footer{padding:24px 0 40px;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
@media(max-width:760px){
.hero{grid-template-columns:1fr;gap:48px;padding-bottom:56px}
.photo{justify-self:start;max-width:280px}
.cols{grid-template-columns:1fr;gap:36px}
.proj{grid-template-columns:1fr;gap:4px}
section{padding:56px 0}
}
</style>
</head>
